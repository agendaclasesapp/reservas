# Despliegue a producción (ADR-012, H-005, H-022, SEC-12, SEC-13, SEC-22, SEC-25). Solo manual, sin inputs;
# el environment `produccion` exige revisor. Orden: link, db push (dry-run + dump), función, secretos,
# guardia de config, config push, re-diff y verificación de Auth.
name: supabase-deploy

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_CLI: supabase@2.121.0

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Sin definir, `config push` empujaría el literal env(...) (H-022). El secreto de Google va vacío:
      # la CLI no lo manda (se carga en el panel, ADR-007).
      RTC_SITE_URL: ${{ vars.RTC_SITE_URL }}
      RTC_REDIRECT_URL: ${{ vars.RTC_REDIRECT_URL }}
      RTC_GOOGLE_CLIENT_ID: ${{ vars.RTC_GOOGLE_CLIENT_ID }}
      RTC_GOOGLE_SECRET: ''
      # Igual con el CAPTCHA: vacío, la CLI no manda la clave secreta de Turnstile (se carga en el panel, ADR-016).
      RTC_TURNSTILE_SECRET: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Comprobar variables y secretos del environment
        run: |
          faltan=0
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF RTC_SITE_URL RTC_REDIRECT_URL RTC_GOOGLE_CLIENT_ID; do
            if [ -z "${!n}" ]; then echo "::error::falta ${n} en el environment produccion"; faltan=1; fi
          done
          exit "$faltan"

      - name: Enlazar el proyecto
        run: npx --yes "$SUPABASE_CLI" link --project-ref "$PROJECT_REF"

      - name: Migraciones pendientes (dry-run)
        run: npx --yes "$SUPABASE_CLI" db push --dry-run | tee "$RUNNER_TEMP/db-push-dry-run.txt"

      - name: Respaldo del esquema (solo estructura)
        run: npx --yes "$SUPABASE_CLI" db dump --linked -f "$RUNNER_TEMP/esquema-previo.sql"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: esquema-previo
          path: |
            ${{ runner.temp }}/esquema-previo.sql
            ${{ runner.temp }}/db-push-dry-run.txt
          retention-days: 30

      - name: Aplicar migraciones
        run: npx --yes "$SUPABASE_CLI" db push

      - name: Desplegar la función enviar-mail
        run: |
          if [ -d supabase/functions/enviar-mail ]; then
            npx --yes "$SUPABASE_CLI" functions deploy enviar-mail --no-verify-jwt --use-api
          else
            echo "supabase/functions/enviar-mail no existe todavía (B03): se omite"
          fi

      - name: Verificar secretos de la función (solo nombres)
        run: |
          if [ ! -d supabase/functions/enviar-mail ]; then echo "sin función: se omite"; exit 0; fi
          lista=$(npx --yes "$SUPABASE_CLI" secrets list --project-ref "$PROJECT_REF")
          faltan=0
          for n in GMAIL_USER GMAIL_APP_PASSWORD MAIL_SECRETO; do
            if ! printf '%s\n' "$lista" | grep -qw "$n"; then echo "::error::falta el secreto ${n} (ops/mails.md)"; faltan=1; fi
          done
          exit "$faltan"

      - name: Diff de configuración y guardia
        run: |
          npx --yes "$SUPABASE_CLI" config diff --project-ref "$PROJECT_REF" --output-format json > "$RUNNER_TEMP/config-diff.json"
          node scripts/seguridad/guardia-config.mjs "$RUNNER_TEMP/config-diff.json" --ref "$PROJECT_REF"

      - name: Empujar la configuración
        run: npx --yes "$SUPABASE_CLI" config push --project-ref "$PROJECT_REF" --yes

      - name: Re-diff y verificación de Auth desplegado
        env:
          SITIO: ${{ vars.RTC_SITE_URL }}
        run: |
          npx --yes "$SUPABASE_CLI" config diff --project-ref "$PROJECT_REF" --output-format json > "$RUNNER_TEMP/config-diff-despues.json"
          node scripts/seguridad/guardia-config.mjs "$RUNNER_TEMP/config-diff-despues.json" --ref "$PROJECT_REF"
          node scripts/seguridad/verificar-auth.mjs --ref "$PROJECT_REF" --sitio "$SITIO"

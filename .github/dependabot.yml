version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Ningún salto de versión mayor por ahora (2026-10-30): la versión publicada está en prueba y cada uno se
    # evalúa a mano (eslint 10 sin soporte de jsx-a11y ni eslint-plugin-react, @types/node sigue a Node 22 de
    # .nvmrc, TypeScript 7 y react-router 8 son migraciones). Las alertas de seguridad siguen llegando igual.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      menores-y-parches:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      acciones:
        patterns: ['*']
